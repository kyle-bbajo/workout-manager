<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 운동 매니저 — 마커리스 운동 기록</title>
<link rel="stylesheet" href="fonts/pretendardvariable-dynamic-subset.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI 운동 매니저">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script>window.APP_BUILD=true;if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<style>
:root{
  --ink:#111827; --ink2:#4B5563; --ink3:#6B7280; --line:#E8EBF0; --bg:#F2F4F7; --card:#FFFFFF;
  --blue:#1D4ED8; --blue-soft:#E8EEFD; --green:#0F7A4F; --green-soft:#E3F4EC; --orange:#B45309; --orange-soft:#FDF0E1;
  --red:#B42318; --red-soft:#FDECEA; --dark:#0B1220;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.01em;color:var(--ink);background:#E9ECF1;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:28px 16px;min-height:100%}
.side{width:260px;flex:none;padding-top:8px}
.side h1{font-size:20px;line-height:1.35;margin:0 0 6px;font-weight:800}
.side p{font-size:13px;color:var(--ink2);margin:0 0 18px;line-height:1.6}
.side .grp{font-size:12px;font-weight:700;color:var(--ink3);margin:18px 0 8px;letter-spacing:.02em}
.side .sc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.side .sc:hover{border-color:#9CA3AF}
.side .sc b{display:block;font-size:14px}
.side .sc span{color:var(--ink3);font-size:12px}
.phone{width:400px;height:820px;flex:none;background:var(--bg);border-radius:36px;border:10px solid #111827;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(17,24,39,.18)}
@media (max-width:760px){
  .stage{padding:0;display:block}
  .side{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:none;border-radius:0;box-shadow:none}
}
.top{background:#fff;border-bottom:1px solid #EEF0F3;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;flex:none}
.top .ttl{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-left:-6px}
.back:hover{background:var(--bg)}
.role{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.role button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.role button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.body{flex:1;overflow-y:auto;padding:14px 14px 18px}
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:8px 0 10px;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center}
.tabs button.on{color:var(--blue);font-weight:700}
.tabs svg{width:22px;height:22px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-size:12.5px;color:var(--blue);font-weight:500}
.muted{color:var(--ink3);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:10px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-green{background:var(--green-soft);color:var(--green)}
.p-orange{background:var(--orange-soft);color:var(--orange)} .p-red{background:var(--red-soft);color:var(--red)} .p-gray{background:var(--bg);color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.full{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list-item:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13.5px}
.kv .k{color:var(--ink2)}
.kv .v{font-weight:700;text-align:right}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--bg);border-radius:10px;padding:10px 8px;text-align:center}
.stat3 b{display:block;font-size:18px}
.stat3 span{font-size:11.5px;color:var(--ink3)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--ink3);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
.alert{border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.55;margin-bottom:12px;display:flex;gap:10px}
.alert.o{background:var(--orange-soft);color:#7C3A06}
.alert.r{background:var(--red-soft);color:#7A1A12}
.alert.b{background:var(--blue-soft);color:#16307F}
.alert.g{background:var(--green-soft);color:#0B4F34}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.cam{background:var(--dark);border-radius:16px;position:relative;overflow:hidden;color:#fff}
.cam svg{display:block;width:100%;height:auto}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.hud .chip{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
.hud .chip.ok{background:rgba(16,185,129,.28)} .hud .chip.warn{background:rgba(245,158,11,.35)}
.rec{position:absolute;right:12px;bottom:10px;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.rec i{width:8px;height:8px;border-radius:50%;background:#EF4444;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.meter div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.meter b{display:block;font-size:17px}
.meter span{font-size:11px;color:var(--ink3)}
.voice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;min-height:44px;display:flex;gap:8px;align-items:flex-start}
.voice .mic{width:22px;height:22px;flex:none;color:var(--blue)}
.cue{background:#FFFBEB;border:1px solid #F5E1A4;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.cue b{display:block;font-size:12px;color:#8A5A00;margin-bottom:4px}
.feedback{margin-top:10px;border-radius:12px;padding:12px;text-align:center;font-weight:800;font-size:15px;line-height:1.45;min-height:50px;display:flex;align-items:center;justify-content:center}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.warn{background:var(--orange-soft);color:var(--orange)}
.feedback.idle{background:#fff;border:1px solid var(--line);color:var(--ink3);font-weight:500;font-size:14px}
.clips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clip{background:var(--dark);border-radius:10px;aspect-ratio:3/4;position:relative;overflow:hidden}
.clip span{position:absolute;left:6px;bottom:5px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;line-height:1.5}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue);flex:none}
.msg-wrap{background:#B9C7D6;border-radius:14px;padding:14px}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:12px;font-size:13px;line-height:1.6;max-width:92%}
.bubble .h{font-weight:800;margin-bottom:6px}
.bubble .lnk{display:block;margin-top:10px;text-align:center;border-top:1px solid var(--line);padding-top:9px;color:var(--blue);font-weight:700}
.toast{position:absolute;left:14px;right:14px;bottom:72px;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;z-index:20;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.field input,.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--blue)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toggle{width:46px;height:28px;border-radius:99px;background:#D1D5DB;position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--blue)} .toggle.on::after{left:21px}
.lock{position:relative}
.lockcover{border-radius:14px;background:#fff;border:1px dashed #CBD5E1;padding:22px 16px;text-align:center;margin-bottom:12px}
.lockcover b{display:block;font-size:15px;margin:8px 0 4px}
.drop{border:1.5px dashed #9CA3AF;border-radius:12px;padding:18px;text-align:center;font-size:13.5px;color:var(--ink2);background:#fff;display:block;cursor:pointer}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.preview-img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.ex .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.modal{position:absolute;inset:0;background:rgba(17,24,39,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
.sheet h2{margin:0 0 4px;font-size:18px}
.foot{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:6px;line-height:1.5}
.spark{width:100%;height:auto;display:block}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.timeline .it{position:relative;padding-bottom:12px;font-size:13.5px;line-height:1.5}
.timeline .it::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.timeline .it .muted{display:block}
.welcome{display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%;padding:8px 6px}
.welcome .logo{width:56px;height:56px;border-radius:16px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
.welcome h2{font-size:24px;line-height:1.35;margin:6px 0 0}
.choice{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%}
.choice:hover{border-color:var(--blue)}
.choice b{display:block;font-size:16px}
.choice span{font-size:13px;color:var(--ink3)}
.kcal-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kcal-row:last-child{border-bottom:none}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--bg);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.small-input{width:84px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;text-align:right}

.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.segc{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink3)}
.segc.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.segc.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.kw{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin:0 6px 6px 0}
.kw.w{background:#111827;color:#fff}
.cue .kw{font-size:12px;padding:4px 9px}
.recbtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px auto 4px;font-weight:800;font-size:15px}
.recbtn i{width:72px;height:72px;border-radius:50%;background:#DC2626;box-shadow:0 0 0 6px #fff,0 0 0 8px #FCA5A5}
.recbtn:hover i{filter:brightness(1.08)}
.anal{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:start}
.anal .clip svg{display:block;width:100%;height:auto}
.fd{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.fd:last-child{border-bottom:none}
.fd span{color:var(--ink2)}
.fd b.ok{color:var(--green)} .fd b.warn{color:var(--orange)} .fd b.up{color:var(--blue)}
.hello{font-size:19px;font-weight:800;margin:2px 2px 14px;letter-spacing:-.01em}
.hl{color:var(--blue)}
.sect{font-size:17px;font-weight:800;margin:18px 2px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;border:2.5px solid transparent;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.tile.sel{border-color:#64748B}
.tl{font-size:12px;color:var(--ink3)}
.tv{margin:2px 0 6px;color:var(--ink);line-height:1.15}
.nb{font-size:30px;font-weight:800;letter-spacing:-.03em}.nd{font-size:19px;font-weight:700}
.st{display:inline-block;min-width:78%;padding:4px 6px;border-radius:999px;color:#fff;font-size:11.5px;font-weight:800;white-space:nowrap}
.st.red{background:#DB4A63}.st.green{background:#2E9E7E}.st.gray{background:#8391A7}.st.orange{background:#D27A1F}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -14px 6px;padding:12px 14px 8px;scroll-snap-type:x mandatory;scroll-padding:0 14px;scrollbar-width:none}
.hcard{flex:0 0 86%;scroll-snap-align:start;background:#fff;border-radius:18px;padding:16px 14px;display:flex;gap:10px;align-items:center;position:relative;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.hcard>div{flex:1;min-width:0;font-size:14.5px}
.tag{position:absolute;top:-11px;left:12px;background:#EF7D1A;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;z-index:1}
.tag::after{content:"";position:absolute;left:14px;bottom:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #EF7D1A}
.tag.r{background:#DB4A63}.tag.r::after{border-top-color:#DB4A63}
.banner{width:100%;display:flex;align-items:center;justify-content:space-between;background:#1D3FBF;color:#fff;border-radius:18px;padding:16px 18px;margin:8px 0 12px;text-align:left}
.banner small{display:block;opacity:.85;font-size:12.5px;margin-bottom:2px}.banner b{font-size:19px}
.banner .arr{font-size:30px;line-height:1}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:22px 6px 14px}
.gi{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.gi .tag{top:-16px;left:50%;transform:translateX(-50%)}.gi .tag::after{left:50%;margin-left:-4px}
.gic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center}.gic svg{width:24px;height:24px}
.t-red{background:#FDECEC;color:#D92D20}.t-blue{background:#E8EEFD;color:#1D4ED8}.t-green{background:#E3F4EC;color:#0F7A4F}.t-amber{background:#FDF0E1;color:#B45309}.t-violet{background:#EFEDFF;color:#5B4BD8}
.gl{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twob{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;min-height:58px}.twob svg{width:20px;height:20px}.twob.blue{color:var(--blue)}
.top .wm{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:-.02em}
.wmi{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}.wmi svg{width:18px;height:18px}
.judge{display:flex;gap:8px;align-items:flex-start;background:var(--blue-soft);color:#16307F;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin-top:10px}
.cal{padding:14px 12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh b{font-size:16px}
.calh .back[disabled]{opacity:.3;cursor:default}
.calw,.calg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.calw span{font-size:11.5px;color:var(--ink3);padding-bottom:6px}
.cd{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink)}
.cd i{width:6px;height:6px;border-radius:50%;background:transparent}
.cd.pt span{background:var(--blue);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cd.sf i{background:#2E9E7E}
.cd.pl span{border:1.5px dashed var(--blue);color:var(--blue);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cd.today{outline:2px solid #111827;outline-offset:-2px}
.cd.sel{background:var(--blue-soft)}
.cleg{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--ink2)}
.cleg span{display:flex;align-items:center;gap:5px}.cleg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dpt{background:var(--blue)}.dsf{background:#2E9E7E}.dpl{border:1.5px dashed var(--blue)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #CBD5E1;flex:none}
.radio.on{border:6px solid var(--blue)}
button,input,select,textarea{font-family:inherit}
.camst{position:absolute;left:0;right:0;bottom:38px;text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;padding:0 14px;line-height:1.5}
.camst:empty{display:none}
#camBox{min-height:220px;display:flex;align-items:center;justify-content:center}
#camBox canvas{width:100%;display:block}
input.nm{font:inherit;font-weight:800;font-size:16px;border:none;border-bottom:1px dashed #C9CED6;background:transparent;color:var(--ink);width:62%;padding:2px 0;border-radius:0}

<div class="stage">

<script type="module">
// 실제 카메라 골격 인식 모듈 (MediaPipe Pose Landmarker)
// - 카메라 영상 위에 골격을 그리고, 얼굴·다른 사람은 모자이크 처리
// - 관절 각도로 반복을 찾고, 동작 패턴(스쿼트형/힙힌지/밀기/당기기/기타)을 나눔
// - 음성 인식으로 코칭 키워드·중량을 뽑고, 트레이너 판단을 기준으로 반영
const MP_VER = '1.2.0';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
// 정확(full): 덜 흔들림 · 빠름(lite): 오래된 폰용
const MODELS = {
  full: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
  lite: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
};
function modelPref(){ try { return localStorage.getItem('aiwm_pose') === 'lite' ? 'lite' : 'full'; } catch (e) { return 'full'; } }
let landmarker = null, loading = null, loadedKind = null;
async function loadModel(onStatus){
  const kind = modelPref();
  if (landmarker && loadedKind === kind) return landmarker;
  if (loading) return loading;
  if (landmarker){ try { landmarker.close(); } catch (e) {} landmarker = null; }
  const MODEL_URL = MODELS[kind];
  loading = (async () => {
    onStatus && onStatus('골격 인식 모델을 불러오는 중… (처음 한 번만 오래 걸려요)');
    const { PoseLandmarker, FilesetResolver } = await import(`${MP_URL}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
    const opts = (delegate) => ({ baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'VIDEO', numPoses: 2,
      minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
    try { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('GPU')); }
    catch (e) { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('CPU')); }
    loadedKind = kind;
    window.dispatchEvent(new Event('livecam-model'));
    return landmarker;
  })();
  try { return await loading; } finally { loading = null; }
}

// ---------- 흔들림 줄이기 (One Euro 필터) ----------
// 가만히 있을 때는 강하게, 빠르게 움직일 때는 약하게 걸러서 떨림만 줄이고 동작은 따라감
function lowpass(a, prev, x){ return prev == null ? x : prev + a * (x - prev); }
function alpha(cutoff, dt){ const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
function OneEuro(minCutoff, beta, dCutoff){ this.mc = minCutoff; this.b = beta; this.dc = dCutoff; this.x = null; this.dx = 0; }
OneEuro.prototype.f = function (v, dt){
  if (this.x == null){ this.x = v; return v; }
  const d = (v - this.x) / dt; this.dx = lowpass(alpha(this.dc, dt), this.dx, d);
  const cutoff = this.mc + this.b * Math.abs(this.dx);
  this.x = lowpass(alpha(cutoff, dt), this.x, v); return this.x;
};
function makeSmoother(){
  const fs = Array.from({ length: 33 }, () => ({ x: new OneEuro(1.0, 60, 1.0), y: new OneEuro(1.0, 60, 1.0), last: null }));
  let tPrev = null;
  return function (lm, t){
    const dt = tPrev == null ? 1 / 30 : Math.min(0.2, Math.max(1 / 120, (t - tPrev) / 1000)); tPrev = t;
    return lm.map((p, i) => {
      const f = fs[i], vis = p.visibility ?? 1;
      if (vis < 0.35 && f.last) return Object.assign({}, f.last, { visibility: vis }); // 잘 안 보이는 관절은 직전 위치 유지
      const q = { x: f.x.f(p.x, dt), y: f.y.f(p.y, dt), z: p.z, visibility: vis }; f.last = q; return q;
    });
  };
}

// ---------- geometry ----------
const D = 180 / Math.PI;
function ang(a, b, c){ // angle at b, degrees
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const d = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1;
  return Math.acos(Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / d))) * D;
}
const SIDES = { L: { sh: 11, el: 13, wr: 15, hip: 23, kn: 25, an: 27, heel: 29, toe: 31 }, R: { sh: 12, el: 14, wr: 16, hip: 24, kn: 26, an: 28, heel: 30, toe: 32 } };
const EDGES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32]];

function metrics(lm, W, H){
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H, v: lm[i].visibility ?? 1 });
  const vis = s => [s.sh, s.hip, s.kn, s.an].reduce((a, i) => a + (lm[i].visibility ?? 1), 0);
  const s = vis(SIDES.L) >= vis(SIDES.R) ? SIDES.L : SIDES.R;
  const sh = P(s.sh), el = P(s.el), wr = P(s.wr), hip = P(s.hip), kn = P(s.kn), an = P(s.an), heel = P(s.heel), toe = P(s.toe);
  const facing = Math.sign((toe.x - heel.x) || 1); // +1: facing right in image
  const trunkSigned = Math.atan2((sh.x - hip.x) * facing, hip.y - sh.y) * D; // + forward lean, - leaning back
  return {
    knee: 180 - ang(hip, kn, an),
    hip: 180 - ang(sh, hip, kn),
    elbow: 180 - ang(sh, el, wr),
    shoulder: ang(hip, sh, el),
    trunk: trunkSigned,
    thigh: Math.atan2(kn.y - hip.y, Math.abs(kn.x - hip.x) || 1e-6) * D, // + : hip above knee
    vis: vis(s) / 4,
  };
}

// 옆모습 기준 관절 각도 (가장 깊이 앉은 순간 비교용)
//  ankle: 정강이가 앞으로 기운 각도(발목 굽힘) · knee: 무릎 굽힘 · hip: 고관절 굽힘 · trunk: 상체가 앞으로 숙여진 각도
//  hipBack: 엉덩이가 발목보다 얼마나 뒤에 있는지 (다리 길이 대비) · thigh: 허벅지가 수평보다 위(+)/아래(-)
function jointAngles(lm, W, H){
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });
  const vis = s => [s.sh, s.hip, s.kn, s.an].reduce((a, i) => a + (lm[i].visibility ?? 1), 0);
  const s = vis(SIDES.L) >= vis(SIDES.R) ? SIDES.L : SIDES.R;
  const sh = P(s.sh), hip = P(s.hip), kn = P(s.kn), an = P(s.an), heel = P(s.heel), toe = P(s.toe);
  const f = Math.sign((toe.x - heel.x) || 1);
  const leg = Math.hypot(kn.x - an.x, kn.y - an.y) + Math.hypot(hip.x - kn.x, hip.y - kn.y) || 1;
  return {
    ankle: Math.atan2((kn.x - an.x) * f, an.y - kn.y) * D,
    knee: 180 - ang(hip, kn, an),
    hip: 180 - ang(sh, hip, kn),
    trunk: Math.atan2((sh.x - hip.x) * f, hip.y - sh.y) * D,
    hipBack: (an.x - hip.x) * f / leg,
    thigh: Math.atan2(kn.y - hip.y, Math.abs(kn.x - hip.x) || 1e-6) * D,
  };
}

// ---------- rep detection ----------
function makeDetector(thr){
  return { low: null, state: 'low', peak: -1e9, thr, tHigh: 0,
    push(v, t){
      if (this.low === null) this.low = v;
      if (this.state === 'low'){
        this.low = Math.min(this.low + 0.15, v); // 천천히 잊고 새 최저값을 따라감
        if (v > this.low + this.thr){ this.state = 'high'; this.peak = v; this.tHigh = t; }
        return false;
      }
      this.peak = Math.max(this.peak, v);
      if (t - this.tHigh > 5000){ this.state = 'low'; this.low = v; return false; } // 자세가 바뀐 것(예: 상체 숙인 채 로우) → 기준점 재설정
      if (v < this.low + this.thr * 0.45){ this.state = 'low'; this.low = v; return t - this.tHigh > 450; }
      return false;
    },
    reset(){ this.state = 'low'; this.peak = -1e9; }
  };

const CLASS_NAME = { squat: '스쿼트 계열', hinge: '힙힌지 계열', press: '머리 위 밀기', pull: '당기기', other: '기타 동작' };

  const weekly=x/g.weeks, weeklyPct=weekly/W*100;
  const eff=Math.max(1,daily-g.short);
  const needDays=total/eff, ext=Math.max(0,needDays-days);
  return {x,total,days,daily,tdee,exTarget,intake,floor,weekly,weeklyPct,ext,note};
}

// ---------- movement models (side view) ----------
const D2R=Math.PI/180;
function pose(d){ // squat, d: 0 top .. 1 bottom
  const ax=118, ay=232, Ls=62, Lt=64, Lb=72;
  const as=d*32*D2R, at=d*96*D2R, ab=(8+d*36)*D2R;
  const kx=ax+Ls*Math.sin(as), ky=ay-Ls*Math.cos(as);
  const hx=kx-Lt*Math.sin(at), hy=ky-Lt*Math.cos(at);
  const sx=hx+Lb*Math.sin(ab), sy=hy-Lb*Math.cos(ab);
  return {ax,ay,kx,ky,hx,hy,sx,sy,bar:'back',
    thigh:90-d*96, trunk:8+d*36, knee:d*128, hip:(8+d*36)+d*96};
}
function poseRDL(d,kb){ // hip hinge, kb: knee-bend factor (1 normal, >1 too much knee)
  const ax=118, ay=232, Ls=62, Lt=64, Lb=72;
  const asd=d*6*kb, atd=d*10*kb, abd=8+d*(kb>1?55:74);
  const as=asd*D2R, at=atd*D2R, ab=abd*D2R;
  const kx=ax+Ls*Math.sin(as), ky=ay-Ls*Math.cos(as);
  const hx=kx-Lt*Math.sin(at), hy=ky-Lt*Math.cos(at);
  const sx=hx+Lb*Math.sin(ab), sy=hy-Lb*Math.cos(ab);
  const hdx=sx+8, hdy=sy+58;
  return {ax,ay,kx,ky,hx,hy,sx,sy,hdx,hdy,bar:'hand',
    trunk:abd, knee:asd+atd, hip:abd+atd};
}
function body(asd,atd,abd){
  const ax=118, ay=232, Ls=62, Lt=64, Lb=72;
  const as=asd*D2R, at=atd*D2R, ab=abd*D2R;
  const kx=ax+Ls*Math.sin(as), ky=ay-Ls*Math.cos(as);
  const hx=kx-Lt*Math.sin(at), hy=ky-Lt*Math.cos(at);
  const sx=hx+Lb*Math.sin(ab), sy=hy-Lb*Math.cos(ab);
  return {ax,ay,kx,ky,hx,hy,sx,sy};
}
function poseRow(d,dev){ // bent-over dumbbell row; dev>1: torso swings up (momentum)
  const abd=8+74*0.8-(dev>1?22*d:0);
  const p=body(5,8,abd);
  const th=d*80*D2R, Lu=34, Lf=32;
  p.ex=p.sx-Lu*Math.sin(th); p.ey=p.sy+Lu*Math.cos(th);
  p.hdx=p.ex; p.hdy=p.ey+Lf; p.bar='db';
  p.trunk=abd; p.pull=d*80; p.sig1=d*80; p.sig2=abd;
  p.labels=[{x:p.ex-8,y:p.ey+4,t:'팔 당김 '+Math.round(d*80)+'°',a:'end'},{x:p.hx-8,y:p.hy+16,t:'상체 '+Math.round(abd)+'°',a:'end'}];
  return p;
}
function posePress(d,dev){ // standing overhead press; dev>1: lower back arches
  const abd=8-(dev>1?18*d:0);
  const p=body(0,0,abd);
  const phi=(160-160*d)*D2R, Lu=34, Lf=32;
  p.ex=p.sx+Lu*Math.sin(phi); p.ey=p.sy-Lu*Math.cos(phi);
  p.hdx=p.ex+(d>0.85?(1-d)*20:0); p.hdy=p.ey-Lf; p.bar='press';
  p.trunk=abd; p.sh=20+160*d; p.sig1=20+160*d; p.sig2=Math.max(0,-(abd-8))*4;
  p.labels=[{x:p.ex+10,y:p.ey+4,t:'어깨 '+Math.round(20+160*d)+'°',a:'start'},{x:p.hx-8,y:p.hy+4,t:'허리 '+(abd<0?'젖힘 '+Math.round(-abd)+'°':'중립'),a:'end'}];
  return p;
}
function poseFor(key,d,v){
  if(key==='squat'){const p=pose(d*v); p.sig1=p.hip; p.sig2=p.knee; p.labels=[{x:p.kx+8,y:p.ky+4,t:'무릎 '+Math.round(p.knee)+'°',a:'start'},{x:p.hx-8,y:p.hy+18,t:'고관절 '+Math.round(p.hip)+'°',a:'end'}]; return p;}
  if(key==='rdl'){const p=poseRDL(d, v>1.5?v:1); p.sig1=p.hip; p.sig2=p.knee; p.labels=[{x:p.kx+8,y:p.ky+4,t:'무릎 '+Math.round(p.knee)+'°',a:'start'},{x:p.hx-8,y:p.hy+18,t:'고관절 '+Math.round(p.hip)+'°',a:'end'}]; return p;}
  if(key==='row') return poseRow(d,v);
  return posePress(d,v);
}
const SIG={squat:['고관절 굴곡','무릎 굴곡'],rdl:['고관절 굴곡','무릎 굴곡'],row:['팔 당김','상체 각도'],press:['어깨 굴곡','허리 젖힘×4']};

function angleChart(samples, opts={}){

}

let sim=null;
function stopSim(){ stopReal(); if(sim){cancelAnimationFrame(sim.raf); sim=null;} try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} }
function repAnalysis(key, peak){
  if(key==='squat'){
    const ok=peak.thigh<=S.criteria.depth;
    const pct=Math.round((90-peak.thigh)/(90-S.criteria.depth)*100);
    return {ok, txt: ok? `가동범위 목표의 ${pct}% · 좋음` : `가동범위 목표의 ${pct}% · 더 앉기`};
  }
  if(key!=='squat' && !repAnalysis.detail){
    const bad = key==='rdl'? peak.knee>25 : key==='row'? (peak.tMax-peak.tMin)>=10 : peak.tMin<0;
    return {ok:!bad, txt: bad? '기준 동작에서 제외할 반복' : '기준 동작으로 저장'};
  }
  if(key==='rdl'){
    const ok=peak.knee<=25;
    return {ok, txt: ok? '힙힌지 좋음 · 무릎 개입 적음' : '무릎이 많이 굽음 · 스쿼트처럼 앉음'};
  }
  if(key==='row'){
    const swing=peak.tMax-peak.tMin, ok=swing<10;
    return {ok, txt: ok? '상체 고정 · 끝까지 당김' : '상체가 들림 · 반동 사용'};
  }
  const ok=peak.tMin>=0;
  return {ok, txt: ok? '머리 위 잠금 · 허리 중립' : '허리 젖힘 · 복압 풀림'};
}
function startClassSim(){
  stopSim();

  sim={mode:'class',seg:0,set:0,rep:0,t0:performance.now(),cycle:2100,buf:[],peak:null,last:null,phase:'',state:'switch',until:performance.now()+1600};
  const loop=(now)=>{
    if(!sim) return;
    const el=document.getElementById('simFig'); if(!el){stopSim();return;}
    const seg=SESSION[sim.seg];
    if(sim.state==='switch'||sim.state==='rest'){
      const p=poseFor(seg.key,0,1);
      el.innerHTML=drawFig(p,{target: seg.key==='squat'? squatTargetLine(): null});

      if(now>=sim.until){sim.state='move';sim.t0=now;sim.peak=null;}
      sim.raf=requestAnimationFrame(loop);return;
    }
    const f=(now-sim.t0)/sim.cycle;
    const v=seg.sets[sim.set][sim.rep];
    const ph=Math.min(f,1);

    const p=poseFor(seg.key,d,v);
    sim.buf.push({k:p.sig2,h:p.sig1}); if(sim.buf.length>140) sim.buf.shift();
    if(!sim.peak) sim.peak={sig1:-1,tMin:999,tMax:-999};

    sim.peak.tMin=Math.min(sim.peak.tMin,p.trunk); sim.peak.tMax=Math.max(sim.peak.tMax,p.trunk);
    sim.phase= ph<0.42?'하강': ph<0.58?'최저점':'상승';

        if(x.judge && !r.ok){ r.txt+=' · 트레이너 “'+x.txt.replace(/[!,].*$/,'')+'” 일치'; rs.judged=(rs.judged||0)+1; } });

        if(sim.set>=seg.sets.length){
          sim.set=0; sim.seg++;

function startSoloSim(key){
  stopSim();
  const cfg=SOLO[key], plan=cfg.plan;
  sim={mode:'solo',key,rep:0,ok:0,t0:performance.now(),cycle:2200,last:null,scores:[]};
  const loop=(now)=>{
    if(!sim) return;
    const el=document.getElementById('simFig'); if(!el){stopSim();return;}
    const f=(now-sim.t0)/sim.cycle, d=(1-Math.cos(Math.min(f,1)*2*Math.PI))/2, v=plan[sim.rep];
    const p=poseFor(key,d,v), ref=poseFor(key,d,1);
    if(f>=1){
      const dev = key==='squat'? v<0.9 : v>1.5;
      const score = dev? 66+((sim.rep*7)%9) : 90+((sim.rep*5)%7);
      sim.scores.push(score); sim.last={ok:!dev,score};
      if(!dev) sim.ok++;
      if(dev) speak(cfg.clip); else if((sim.rep+1)%4===0) speak('좋아요');
      sim.rep++; sim.t0=now;
      if(sim.rep>=plan.length){ const avg=Math.round(sim.scores.reduce((a,b)=>a+b,0)/sim.scores.length); S.soloResult={ok:sim.ok,n:sim.rep,avg}; stopSimKeep(); render(); return; }
    }
    el.innerHTML=drawFig(p,{col: sim.last&&!sim.last.ok?'#FBBF24':'#7DD3FC', ghost:ghostOf(ref)});
    const fb=document.getElementById('fb');
    if(fb&&sim.last){fb.className='feedback '+(sim.last.ok?'ok':'warn');fb.textContent= sim.last.ok?'수업 동작과 일치 '+sim.last.score+'%':cfg.msg+' · 트레이너 음성: “'+cfg.clip+'”';}
    const sc=document.getElementById('valScore'); if(sc&&sim.last) sc.textContent=sim.last.score+'%';
    const ok=document.getElementById('cntOk'); if(ok) ok.textContent=sim.ok+'/'+sim.rep;
    const rp=document.getElementById('cntRep'); if(rp) rp.textContent=sim.rep;
    sim.raf=requestAnimationFrame(loop);
  };
  sim.raf=requestAnimationFrame(loop);
}
function stopSimKeep(){ if(sim){cancelAnimationFrame(sim.raf); sim=null;} }

function trendChart(){
  const pts=[{d:'10.01',v:31.8},{d:'10.08',v:31.2},{d:'10.13',v:31.4},{d:'10.20',v:30.6},{d:'10.27',v:30.0},{d:'11.03',v:S.inbody.pbf}];
  const W=320,H=170,l=10,r=44,t=34,b=26, lo=28, hi=33;
  const x=i=>l+i*(W-l-r)/(pts.length-1), y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  let path='M'+x(0)+' '+y(pts[0].v);
  for(let i=1;i<pts.length;i++){const x0=x(i-1),x1=x(i),y0=y(pts[i-1].v),y1=y(pts[i].v),cx=(x0+x1)/2; path+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`;}
  const last=pts.length-1, ticks=[33,31.5,30,28.5];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="체지방률 추이">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-r+4}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF0F3"/><text x="${W-2}" y="${y(v)+4}" font-size="11" fill="#9AA3AF" text-anchor="end">${v.toFixed(1)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#D5DAE1" stroke-width="2"/>
    <line x1="${x(last)}" x2="${x(last)}" y1="${t-6}" y2="${H-b}" stroke="#9AA3AF" stroke-dasharray="4 4"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===last?5.5:4.5}" fill="#1D4ED8"/>`).join('')}
    <rect x="${W-r-150}" y="2" width="150" height="24" rx="8" fill="#F2F4F7"/>
    <text x="${W-r-140}" y="18" font-size="12" fill="#6B7280">${S.inbody.date.replace('월 ','.').replace('일','')} ${S.inbody.time}</text>
    <text x="${W-r-10}" y="18" font-size="12.5" font-weight="800" fill="#111827" text-anchor="end">${S.inbody.pbf}%</text>
    <text x="${x(0)}" y="${H-6}" font-size="11" fill="#9AA3AF">${pts[0].d}</text><text x="${x(last)}" y="${H-6}" font-size="11" fill="#9AA3AF" text-anchor="middle">${pts[last].d}</text>
  </svg>`;
}

function sparkline(){
  const W=300,H=110,pad=26; const xs=depthHist.map((d,i)=>pad+i*(W-2*pad)/(depthHist.length-1));

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="회차별 스쿼트 깊이 변화">
    <line x1="${pad}" x2="${W-pad}" y1="${y(0)}" y2="${y(0)}" stroke="#9CA3AF" stroke-dasharray="4 4"/>
    <text x="${W-pad}" y="${y(0)-5}" font-size="10" fill="#6B7280" text-anchor="end">허벅지 수평</text>

  </svg>`;
}

    <rect x="${x0}" y="60" width="${w}" height="62" rx="28" fill="#E8C08A"/>
    <rect x="${x0}" y="60" width="${w}" height="62" rx="28" fill="none" stroke="#B9864A" stroke-width="3"/>
    <ellipse cx="${x0+w}" cy="91" rx="16" ry="31" fill="#F6E7CF" stroke="#B9864A" stroke-width="3"/>
    <path d="M${x0+w} 91 m-9 0 a9 9 0 1 0 18 0 a5 5 0 1 0 -10 0" fill="none" stroke="#B9864A" stroke-width="3"/>
    <rect x="${x0}" y="56" width="${cut-x0}" height="70" fill="#22C55E" opacity=".18"/>
    <line x1="${cut}" x2="${cut}" y1="40" y2="140" stroke="#22C55E" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="${cut}" y="32" fill="#86EFAC" font-size="13" font-weight="700" text-anchor="middle">여기까지</text>
    <text x="${(x0+cut)/2}" y="96" fill="#14532D" font-size="13" font-weight="800" text-anchor="middle">${Math.round(frac*100)}%</text>
  </svg>`;
}

function normLm(lm){
  const mid=(a,b)=>({x:(lm[a].x+lm[b].x)/2,y:(lm[a].y+lm[b].y)/2});
  const h=mid(23,24), s=mid(11,12), L=Math.hypot(s.x-h.x,s.y-h.y)||1;
  return lm.map(p=>({x:(p.x-h.x)/L,y:(p.y-h.y)/L}));
}
const SIMJ=[11,12,13,14,15,16,23,24,25,26,27,28];
function poseSim(a,b){
  if(!a||!b) return null;
  const A=normLm(a), B=normLm(b);
  const dist=f=>SIMJ.reduce((t,i)=>t+Math.hypot(A[i].x*f-B[i].x,A[i].y-B[i].y),0)/SIMJ.length;
  const d=Math.min(dist(1),dist(-1)); // 좌우 방향이 달라도 비교
  return Math.max(0,Math.min(100,Math.round(100-d*110)));
}
const EDG=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
function lmSVG(lm,ref){
  if(!lm) return '';

  const P=normLm(lm), R=ref?normLm(ref):null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; [P,R].forEach(Q=>Q&&Q.forEach((p,i)=>{if(i<11&&i!==0)return;x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}));
  const pad=.35, w=x1-x0+pad*2, h=y1-y0+pad*2;
  const line=(Q,st)=>EDG.map(([a,b])=>`<line x1="${Q[a].x.toFixed(3)}" y1="${Q[a].y.toFixed(3)}" x2="${Q[b].x.toFixed(3)}" y2="${Q[b].y.toFixed(3)}" ${st}/>`).join('');
  return `<svg viewBox="${(x0-pad).toFixed(3)} ${(y0-pad).toFixed(3)} ${w.toFixed(3)} ${h.toFixed(3)}" role="img" aria-label="반복 최저점 골격" style="width:100%;height:170px;display:block;background:var(--dark);border-radius:12px">
    ${R?line(R,'stroke="#FDE68A" stroke-width="0.05" stroke-dasharray="0.12 0.1" stroke-linecap="round"'):''}
    ${line(P,'stroke="#7DD3FC" stroke-width="0.07" stroke-linecap="round"')}

}

function buildVTT(R){
  const t=s=>{ s=Math.max(0,s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=(s%60).toFixed(3).padStart(6,'0'); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+x; };

  if(R.vttURL) URL.revokeObjectURL(R.vttURL);
  R.vttURL=URL.createObjectURL(new Blob([body],{type:'text/vtt'}));
}

const AI_MODELS=[['gemini-flash-latest','Gemini Flash · 무료 사용량 있음'],['claude-sonnet-5-5','Claude Sonnet 5.5 · 정확'],['claude-haiku-5-5','Claude Haiku 5.5 · 빠름']];
// 시험판 공용 AI: config.js의 aiProxy(키를 숨긴 중계 서버)를 쓰고, 내 키를 넣으면 내 키가 우선
// 앱에 들어 있는 AI (config.js): 중계 서버(aiProxy) 또는 앱 공용 키(aiKey). 회원은 아무 설정 없이 씀
function sharedAI(){ const C=window.APP_CONFIG||{}; if(C.aiProxy) return {proxy:String(C.aiProxy).replace(/\/$/,''),model:C.aiModel||'gemini-flash-latest'}; const k=C.aiKey?(C.aiKeyEnc?atob(C.aiKey).split('').reverse().join(''):C.aiKey):''; return k?{key:k,model:C.aiModel||'gemini-flash-latest'}:null; }
function aiCfg(){ const c=Object.assign({model:'gemini-flash-latest',key:''}, LS.get('aiwm_ai',{})); if(c.key) c.own=true; if(!c.key){ const sh=sharedAI(); if(sh){ if(sh.proxy) c.proxy=sh.proxy; if(sh.key) c.key=sh.key; c.model=sh.model; c.shared=true; } } return c; }
function aiReady(){ const c=aiCfg(); return !!(c.key||c.proxy); }

// 사진 → 긴 변 max px JPEG (아이폰 HEIC도 사파리가 디코딩)
function imgToJpeg(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); const d=c.toDataURL('image/jpeg',0.82); res({dataURL:d,b64:d.split(',')[1]}); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없어요')); };
    im.src=url;
  });
}
function thumbOf(dataURL){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=120; const s=Math.min(im.width,im.height); c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,120,120); res(c.toDataURL('image/jpeg',0.7)); }; im.onerror=()=>res(null); im.src=dataURL; }); }
function parseJSON(t){ t=String(t||'').replace(/```json|```/g,''); const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) throw new Error('AI 답을 읽지 못했어요'); return JSON.parse(t.slice(a,b+1)); }
async function aiCall(prompt,b64,mime){
  mime=mime||'image/jpeg';
  const c=aiCfg(); if(!c.key&&!c.proxy) throw new Error('NOKEY');
  let r, j;
  try{
    if(c.proxy||c.model.startsWith('gemini')){
      const parts=[]; if(b64) parts.push({inline_data:{mime_type:mime,data:b64}}); parts.push({text:prompt});
      r=await fetch(c.proxy?`${c.proxy}/?model=${encodeURIComponent(c.model)}`:`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent`,{method:'POST',headers:c.proxy?{'content-type':'application/json'}:{'content-type':'application/json','x-goog-api-key':c.key},
        body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})});
      j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(aiErr(r.status,(j.error&&j.error.message)||''));
      return ((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    }
    if(b64&&!mime.startsWith('image/')) throw new Error('Claude는 소리를 받지 못해요. 자막 추출은 Gemini를 골라 주세요.');
    const content=[]; if(b64) content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}}); content.push({type:'text',text:prompt});
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:c.model,max_tokens:1200,messages:[{role:'user',content}]})});
    j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(aiErr(r.status,(j.error&&j.error.message)||''));
    return (j.content||[]).map(b=>b.text||'').join('');
  }catch(e){
    if(e instanceof TypeError) throw new Error('AI 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
    throw e;
  }
}
function aiErr(st,msg){
  if(st===400&&/api key|API_KEY/i.test(msg)) return 'API 키가 맞지 않아요. 내 정보 → AI 연결에서 다시 넣어 주세요.';
  if(st===401||st===403) return 'API 키가 맞지 않거나 권한이 없어요. 내 정보 → AI 연결에서 확인해 주세요.';
  if(st===404) return '모델 이름을 찾지 못했어요. AI 연결에서 다른 모델을 골라 보세요.';
  if(st===429) return '사용량 한도에 걸렸어요. 잠시 뒤 다시 해 주세요.';
  if(st===402||/credit|billing/i.test(msg)) return 'API 결제(크레딧)가 필요해요.';
  return 'AI 오류 ('+st+') '+msg.slice(0,80);
}

function mergeSpeechSegs(R){

  const speech=[];

async function audioToWavChunks(blob,sec){
  const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  const buf=await blob.arrayBuffer();
  const audio=await new Promise((res,rej)=>{ const pr=ac.decodeAudioData(buf,res,rej); if(pr&&pr.catch) pr.catch(rej); });
  try{ ac.close(); }catch(e){}
  const sr=16000, len=Math.max(1,Math.ceil(audio.duration*sr));
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; const off=new OAC(1,len,sr);
  const src=off.createBufferSource(); src.buffer=audio; src.connect(off.destination); src.start(0);
  const pcm=(await off.startRendering()).getChannelData(0);
  const out=[], step=sec*sr;
  for(let o=0;o<pcm.length;o+=step){
    const seg=pcm.subarray(o,Math.min(pcm.length,o+step)), n=seg.length;
    const wav=new DataView(new ArrayBuffer(44+n*2)); const w=(p,t)=>{ for(let i=0;i<t.length;i++) wav.setUint8(p+i,t.charCodeAt(i)); };
    w(0,'RIFF'); wav.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); wav.setUint32(16,16,true); wav.setUint16(20,1,true); wav.setUint16(22,1,true);
    wav.setUint32(24,sr,true); wav.setUint32(28,sr*2,true); wav.setUint16(32,2,true); wav.setUint16(34,16,true); w(36,'data'); wav.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){ const v=Math.max(-1,Math.min(1,seg[i])); wav.setInt16(44+i*2,v<0?v*0x8000:v*0x7FFF,true); }
    out.push({offset:o/sr, b64:b64OfBytes(new Uint8Array(wav.buffer))});
  }
  return out;
}

const DOW='일월화수목금토';
const pad2=n=>String(n).padStart(2,'0');
function ymd(d,m,dd){ if(typeof d==='number') return d+'-'+pad2(m)+'-'+pad2(dd); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); } // (y,m,d) 형태도 받음: 회원 달력과 함께 씀
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function mondayOf(s){ const d=parseYmd(s); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); }
function hm2min(t){ const [h,m]=String(t||'0:0').split(':').map(Number); return h*60+(m||0); }

function reqAct(act,a){

    case 'bookTime': S.book.time=a.dataset.t; S.book.note=($('#bookNote')||{}).value||''; $('#modalRoot').innerHTML=bookSheet(); return true;
    case 'bookClose': $('#modalRoot').innerHTML=''; return true;
    case 'bookSend': { const B=S.book; if(!B||!B.time) return true; const m=members.find(x=>x.id===ME_MID);
      const it={id:'q'+Date.now().toString(36),date:B.date,time:B.time,dur:60,mid:ME_MID,name:m?m.name:'회원',note:(($('#bookNote')||{}).value||'').trim(),st:'req',by:'member',reqAt:Date.now()};
      if(overlaps(it).length){ toast('방금 다른 수업이 잡혔어요. 다른 시간을 골라 주세요'); $('#modalRoot').innerHTML=bookSheet(); return true; }
      sched().push(it); saveSched(); $('#modalRoot').innerHTML='';
      // 다른 휴대폰의 트레이너에게는 링크로 전달 (같은 휴대폰이면 트레이너 화면에 바로 보임)

function handleReqHash(){
  try{ const h=new URLSearchParams(location.hash.slice(1)), rq=h.get('req'), cf=h.get('conf'); if(!rq&&!cf) return false;
    history.replaceState(null,'',location.pathname+location.search);
    if(rq){ const it=JSON.parse(unb64u(rq)); if(!sched().find(x=>x.id===it.id)){ sched().push(Object.assign(it,{st:'req',remote:true})); saveSched(); }
      S.role='trainer'; S.tab='schedule'; S.sub=null; S.wkStart=mondayOf(it.date); S.wkSel=it.date; setTimeout(()=>toast(`${it.name} 회원 수업 요청이 들어왔어요 · 승인해야 확정돼요`),600); }
    if(cf){ const r=JSON.parse(unb64u(cf)), x=sched().find(l=>l.id===r.id);
      if(r.ok){ if(x){ x.st='ok'; } else sched().push({id:r.id,date:r.date,time:r.time,dur:60,mid:ME_MID,name:(members.find(m=>m.id===ME_MID)||{}).name||'회원',st:'ok'}); saveSched(); setTimeout(()=>toast(`${mdLabel(r.date)} ${r.time} 수업이 확정됐어요`),600); }
      else { SCHED=sched().filter(l=>l.id!==r.id); saveSched(); const no=LS.get('aiwm_reqno',[]); no.unshift({id:r.id,mid:ME_MID,date:r.date,time:r.time,why:r.why||''}); LS.set('aiwm_reqno',no.slice(0,50)); setTimeout(()=>toast('요청한 시간이 어려워요 · 다른 시간으로 요청해 주세요'),600); }
      S.role='member'; S.tab='home'; S.sub=null; }
    return true;

}

function sessionRev(x,c){ const m=members.find(y=>y.id===x.mid); const si=m&&x.n?sessionInfo(m,x.n):{c:null}; const unit=si.c?(si.unit||c.price):unitPriceC(x.mid,c); return {unit,bonus:!!si.bonus,rev:si.bonus?0:unit}; }

const DEFAULT_REF={squat:{ankle:30,knee:105,hip:100,trunk:40,hipBack:0.32,thigh:-2},hinge:{ankle:8,knee:20,hip:85,trunk:72,hipBack:0.36,thigh:40}};

function feedbackFor(cls,me,ref){

    if(d('ankle')<-8) out.push({k:'ankle',t:`발목을 약 ${deg(d('ankle'))}° 더 굽혀도 돼요`,s:'무릎을 발끝 방향으로 조금 더 보내세요'});

}

function uploadResultHTML(res,cls,ref){
  const reps=res.reps.filter(r=>r.cls===cls||cls==='hinge'&&r.cls==='squat'||cls==='squat'&&r.cls==='hinge');
  if(!reps.length) return `<div class="feedback warn">${res.reps.length?'수업 때 배운 동작과 다른 동작으로 보여요.':'반복을 찾지 못했어요.'}</div><p class="muted" style="font-size:12.5px;margin:8px 0">옆에서 머리부터 발까지 보이게, 2~3m 떨어져 찍어 주세요. 반복은 끝까지 앉았다 일어나야 1회로 셉니다.${res.seenRatio<0.5?' (사람이 잘 보이지 않는 장면이 많았어요)':''}</p><button class="btn sm sec full" data-act="upReset">다시 올리기</button>`;
  const me=avgAng(reps.map(r=>r.ang)), R=ref.ang, fb=feedbackFor(cls,me,R);
  const perRep=reps.map(r=>feedbackFor(cls,r.ang,R)), good=perRep.filter(f=>!f.length).length;
  const best=reps.slice().sort((a,b)=>feedbackFor(cls,a.ang,R).length-feedbackFor(cls,b.ang,R).length)[0];
  return `<div class="alert ${fb.length?'o':'g'}" style="margin:0 0 10px"><div><b>${reps.length}회 중 ${good}회가 수업 동작과 비슷해요</b><br>${fb.length?'아래 순서대로 고쳐 보세요':'수업 때 배운 대로 잘 하고 있어요'}</div></div>
    ${fb.length?`<div class="fblist">${fb.map((f,i)=>`<div class="fbi"><span class="n">${i+1}</span><div><b>${f.t}</b><div class="muted" style="font-size:12.5px">${f.s}</div></div></div>`).join('')}</div>`:''}
    <div class="anal" style="margin-top:10px"><div class="clip" style="aspect-ratio:auto">${lmSVG(best.lm, ref.lm)}<span>${ref.lm?'점선: 수업 때 기준':'가장 깊이 앉은 순간'}</span></div>
    <div><table class="t" style="font-size:12.5px"><tr><th>관절</th><th>수업</th><th>나</th></tr>${JOINT_LABEL.map(([k,l])=>{ const df=me[k]-R[k], big=k==='hipBack'?Math.abs(df)>0.06:Math.abs(df)>8; return `<tr><td>${l.split(' ')[0]}</td><td>${fmtJ(k,R[k])}</td><td><b style="color:${big?'var(--orange)':'var(--green)'}">${fmtJ(k,me[k])}</b></td></tr>`; }).join('')}</table></div></div>
    <div class="muted" style="font-size:12px;margin:8px 0 4px">반복별</div><div>${perRep.map((f,i)=>`<span class="kw" style="${f.length?'background:var(--orange-soft);color:var(--orange)':''}">${i+1}회 ${f.length?f.map(x=>({depth:'더 앉기',trunk:'상체',hip:'엉덩이',ankle:'발목',knee:'무릎'})[x.k]).join('·'):'좋음'}</span>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin:8px 0">비교 기준: ${ref.src} · 수업 때 동작과 비교한 안내이며 의학적 판단이 아니에요</p>
    <div class="row"><button class="btn sm sec" data-act="upReset" style="flex:1">다른 영상 올리기</button><button class="btn sm sec" data-act="upShare" style="flex:1">트레이너에게 보내기</button></div>`;
}
async function runUpload(file,name){
  const key=N2K[name]||'squat', cls=K2C[key];
  if(!window.LiveCam||!window.LiveCam.analyzeVideo){ S.up={name,status:'error',err:'분석 모듈을 불러오는 중이에요. 잠시 뒤 다시 올려 주세요'}; keepScroll(render); return; }
  S.up={name,status:'run',pct:0,msg:'골격 모델 준비 중…'}; keepScroll(render);
  const set=(pct,msg)=>{ const b=$('#upBar'), m=$('#upMsg'); if(b) b.style.width=Math.round(pct*100)+'%'; if(m&&msg) m.textContent=msg; };
  try{
    const res=await window.LiveCam.analyzeVideo(file,{canvas:$('#upCanvas'),fps:15,onStatus:t=>set(0,t),onProgress:p=>set(p,`영상 분석 중… ${Math.round(p*100)}%`),onRep:(r,n)=>set(null,`반복 ${n}회 찾음`)});
    S.up={name,status:'done',res};
    const log=LS.get('aiwm_uploads',[]); const me=res.reps.length?avgAng(res.reps.map(r=>r.ang)):null, ref=refFor(cls);
    log.unshift({name,cls,date:ymd(new Date()),t:min2hm(new Date().getHours()*60+new Date().getMinutes()),reps:res.reps.length,fb:me&&ref?feedbackFor(cls,me,ref.ang).map(f=>f.t):[],me}); LS.set('aiwm_uploads',log.slice(0,100));
  }catch(e){ S.up={name,status:'error',err:e.message||'분석하지 못했어요'}; }
  if(S.sub==='solo') keepScroll(render);
}
function uploadAct(act,a){
  switch(act){
    case 'upReset': S.up=null; keepScroll(render); return true;
    case 'upShare': { const L=LS.get('aiwm_uploads',[])[0]; if(!L) return true; const t=`[혼자 연습 영상 분석] ${L.name} ${L.reps}회\n${L.fb.length?L.fb.map((f,i)=>`${i+1}. ${f}`).join('\n'):'수업 때 동작과 비슷하게 했어요'}`; shareOrCopy(t,linkBase(),'분석 결과를 복사했어요 · 트레이너에게 보내 주세요'); return true; }
  }
  return false;
}
function bindUpload(){ document.querySelectorAll('.upFile').forEach(inp=>inp.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) runUpload(f,inp.dataset.n); })); }

    <div class="exitem" data-cat="트레이너 동작" data-q="한 발 들고 힙힌지 트레이너 동작 햄스트링"><div class="ic">${I.run}</div><div class="sp"><b>한 발 들고 힙힌지</b><div class="muted">트레이너 시연 3회로 등록 · 자동 인식</div></div><button class="btn sm" data-act="exPick" data-n="한 발 들고 힙힌지" data-d="트레이너 동작 · 10회 × 3" data-c="1" ${added.has('한 발 들고 힙힌지')?'disabled':''}>${added.has('한 발 들고 힙힌지')?'추가됨':'추가'}</button></div>
    ${cats.map(c=>`<div class="excat" data-cat="${c}">${c}</div>`+EX_LIB[c].map(([n,tool,part])=>`<div class="exitem" data-cat="${c}" data-q="${n} ${tool} ${part} ${c}"><div class="sp"><b>${n}</b><div class="muted">${part} · ${tool}</div></div><button class="btn sm sec" data-act="exPick" data-n="${n}" data-d="${part} · ${tool}" data-c="0" ${added.has(n)?'disabled':''}>${added.has(n)?'추가됨':'추가'}</button></div>`).join('')).join('')}
    <p class="muted" id="exEmpty" style="display:none;text-align:center;margin:16px 0">찾는 운동이 없어요. 트레이너에게 새 동작 등록을 요청해 보세요.</p>
  </div>
  <button class="btn sec full" data-act="closeModal" style="margin-top:12px">닫기</button></div></div>`;
}
function bindExSheet(){
  const q=$('#exQ'), cats=$('#exCats'); if(!q||!cats) return; let cat='';
  const apply=()=>{ const t=(q.value||'').replace(/\s+/g,''); let n=0;
    document.querySelectorAll('#exList .exitem').forEach(e=>{ const ok=(!cat||e.dataset.cat===cat)&&(!t||e.dataset.q.replace(/\s+/g,'').includes(t)); e.style.display=ok?'':'none'; if(ok) n++; });
    document.querySelectorAll('#exList .excat').forEach(h=>{ const any=[...document.querySelectorAll(`#exList .exitem[data-cat="${h.dataset.cat}"]`)].some(e=>e.style.display!=='none'); h.style.display=any?'':'none'; });
    $('#exEmpty').style.display=n?'none':''; };
  q.addEventListener('input',apply);
  cats.addEventListener('click',e=>{ const b=e.target.closest('button[data-cat]'); if(!b) return; e.stopPropagation(); cat=b.dataset.cat; cats.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); apply(); });
}

if(window.APP_BUILD){ const _mx=LS.get('aiwm_myex',null); if(_mx) S.addedEx=_mx; }
// ---------- render ----------
let modal=null;
function render(){
  let html='';
  if(S.signReq){html=signScreen();}
  else if(!S.role){html=welcome();}
  else if(S.role==='trainer'){
    if(S.sub==='live') html=S.realOn?realLive():tLive();
    else if(S.sub==='realReview') html=realReview();
    else if(S.sub==='review') html=tReview();
    else if(S.sub==='kakao') html=tKakao();
    else if(S.sub==='member') html=tMemberDetail(S.subArg)+(S.subArg==='hw'?signCard('hw')+signHistory('hw'):'');
    else html={home:tHome,schedule:tSchedule,members:tMembers,session:tSession,settle:tSettle}[S.tab]();
  } else {
    if(S.sub==='solo') html=(S.soloReal&&!S.ptEnded&&!needMedical())?(renderTop('혼자 연습 · '+S.subArg,true),soloRealView(S.subArg)):mSolo(S.subArg);
    else if(S.sub==='goal') html=mGoal();
    else if(S.sub==='parq') html=mParq();
    else html={home:mHome,notes:mNotes,practice:mPractice,diet:mDiet,me:mMe}[S.tab]();
  }
  $('#body').innerHTML=html;
  renderTabs();
  $('#modalRoot').innerHTML = modal==='re'?reReportModal(): modal==='addEx'?addExModal():'';
  afterRender();
}
function afterRender(){
  if(S.role==='trainer' && S.sub==='live' && S.recOn) startClassSim();
  if(S.role==='trainer' && S.sub==='live' && S.realOn) startRealClass();
  else if(window.APP_BUILD && S.role==='trainer' && S.sub==='live' && !S.recOn) startPreview();
  bindWeekGrid(); bindUpload(); bindExSheet(); updateStoreUse(); bindMemberSearch(); { const sc=document.getElementById('sigCanvas'); if(sc&&!document.getElementById('modalRoot').contains(sc)) setTimeout(bindSigPad,30); }
  if(S.role==='member' && S.sub==='solo' && S.soloReal) startRealSolo(S.subArg);
  if(S.role==='trainer' && S.sub==='review'){
    const el=$('#reviewTimer');
    const tick=()=>{const e=$('#reviewTimer'); if(!e||S.sub!=='review')return; const s=Math.floor((Date.now()-S.report.startedAt)/1000); e.textContent='확인 시간 '+Math.floor(s/60)+'분 '+(s%60)+'초'; setTimeout(tick,1000);};
    if(el) tick();
  }
  const dt=$('#dietTotal'); if(dt) dt.addEventListener('change',()=>{ const v=parseFloat(dt.value); if(S.dietRec&&isFinite(v)&&v>0){ S.dietRec.total=Math.round(v); keepScroll(render); } });
  document.querySelectorAll('.dietFile').forEach(df=>df.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) analyzeFood(f); }));
  const of=$('#ocrFile'); if(of) of.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) analyzeInbody(f); });
  ['g_target','g_weeks'].forEach(id=>{const el=$('#'+id); if(el) el.addEventListener('change',()=>{const v=parseFloat(el.value); if(!isFinite(v))return; if(id==='g_target')S.goal.target=Math.min(Math.max(8,v),S.inbody.pbf-0.5); else S.goal.weeks=Math.min(Math.max(2,Math.round(v)),52); render();});});
  const gr=$('#g_ratio'); if(gr) gr.addEventListener('input',()=>{S.goal.ratio=+gr.value; keepScroll(render);});
  const gs=$('#g_short'); if(gs) gs.addEventListener('input',()=>{S.goal.short=+gs.value; keepScroll(render);});
  ['stPrice','stRate'].forEach(id=>{const el=$('#'+id); if(el) el.addEventListener('change',()=>{const v=parseFloat(el.value); if(!isFinite(v)||v<0)return; if(id==='stPrice')S.settle.price=v; else S.settle.rate=Math.min(100,v); render();});});
}
function keepScroll(fn){const b=$('#body');const y=b.scrollTop;fn();b.scrollTop=y;}
function readImg(file,cb){ if(!file) return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }

// ---------- events ----------
document.addEventListener('click',e=>{
  const sc=e.target.closest('[data-go]');
  if(sc){ const g=sc.dataset.go; modal=null;
    if(g==='t-live'){S.role='trainer';S.tab='session';go('live');}
    else if(g==='m-practice'){S.role='member';S.tab='practice';S.soloResult=null;go('solo','스쿼트');}
    else if(g==='t-member'){S.role='trainer';S.tab='members';go('member','hw');}
    else if(g==='m-diet'){S.role='member';S.ptEnded=false;S.dietRec=null;tab('diet');}
    else if(g==='m-goal'){S.role='member';S.tab='me';go('goal');}
    else if(g==='t-settle'){S.role='trainer';tab('schedule');toast('스케줄 다음으로 정산 탭도 눌러 보세요');}
    return; }
  const rb=e.target.closest('[data-role]'); if(rb){modal=null;setRole(rb.dataset.role);return;}
  const tb=e.target.closest('[data-tab]'); if(tb){modal=null;tab(tb.dataset.tab);return;}
  const a=e.target.closest('[data-act]'); if(!a) return;
  if(a.dataset.act==='closeModal'){ if(e.target.closest('[data-stop]') && !e.target.closest('button[data-act="closeModal"]')) return; modal=null;render();return;}
  const act=a.dataset.act;
  if(realAct(act,a)) return;
  if(aiAct(act,a)) return;
  if(schedAct(act,a)) return;
  if(memAct(act,a)) return;
  if(signAct(act,a)) return;
  if(reqAct(act,a)) return;
  if(focusAct(act,a)) return;
  if(parqAct(act,a)) return;
  if(tileAct(act,a)) return;
  if(uploadAct(act,a)) return;
  if(settleAct(act,a)) return;
  switch(act){
    case 'back':
      if(S.role==='trainer'){ if(S.sub==='kakao') go('review'); else if(S.sub==='review') go(null); else go(null);} else go(null); break;
    case 'startClass': if(a.dataset.id!=='hw'){toast('시연에서는 혜원 회원 수업을 준비했어요');S.subArg='hw';} S.tab='session'; go('live'); break;
    case 'recStart': S.realOn=false; S.recOn=true; render(); break;
    case 'skipSim': case 'endClass': stopSim(); S.report.startedAt=Date.now(); go('review'); break;
    case 'kwDel': S.kwRemoved=S.kwRemoved||{}; S.kwRemoved[a.dataset.k]=true; keepScroll(render); break;
    case 'conf': $('#confirmRow').innerHTML='<span class="pill p-green">'+(a.dataset.v==='in'?'자세 주의로 표시됨':'기록에서 제외됨')+'</span>'; break;
    case 'tts': if(!speak(a.dataset.t)) toast('이 브라우저에서는 음성 재생을 쓸 수 없어요'); break;
    case 'toKakao': go('kakao'); break;
    case 'send': S.report.sent=true; toast('시연용: 실제 앱에서는 카카오톡 공유 창이 열립니다'); setTimeout(()=>{S.tab='home';go(null);},1400); break;
    case 'memberDetail': S.tab='members'; go('member',a.dataset.id); break;
    case 'reReport': modal='re'; render(); break;
    case 'recalib': { const m=$('#calibMsg'); m.textContent='정답 동작 3회 촬영 중… (시연)'; setTimeout(()=>{S.criteria.depth=4;S.criteria.trunk=[34,46];render();toast('기준 저장: 허벅지 수평 +4° 이하 · 상체 34–46°');},1300);} break;
    case 'soloToggle': S.soloOk[a.dataset.k]=!S.soloOk[a.dataset.k]; keepScroll(render); break;
    case 'saveKcal': { const v=parseFloat($('#trKcal').value); if(isFinite(v)&&v>0){const mm=S.meals.find(x=>x.id===(a.dataset.id||'m2')); if(mm){mm.tr=Math.round(v); if(mm.own) saveMeals();} toast('트레이너 수정값 저장 · 회원 화면에 반영됩니다');} } break;
    case 'acceptReq': S.scheduleReqAccepted=true; render(); toast('예약 승인 · 회원에게 알림이 갑니다'); break;
    case 'settleMode': S.settle.mode=a.dataset.v; if(a.dataset.v==='rate'){S.settle.rate=40;} else {S.settle.rate=50;} render(); break;
    case 'copySettle': { const st=S.settle; const t='10월 정산 내역\n완료 수업 46회\n방식: '+(st.mode==='fixed'?'회당 수당':'매출 비율')+'\n단가 '+fmt(st.price)+'원 × '+st.rate+'%\n정산금 '+fmt(46*st.price*st.rate/100)+'원';
      try{navigator.clipboard.writeText(t).then(()=>toast('복사했어요'),()=>toast('복사가 막혀 있어요. 화면의 숫자를 사용해 주세요'));}catch(err){toast('복사가 막혀 있어요');} } break;
    case 'soloStart': S.soloResult=null; go('solo',a.dataset.n); break;
    case 'soloGo': S.soloResult=null; { const fb=$('#fb'); if(fb){fb.className='feedback idle';fb.textContent='인식 중…';} } { const k=a.dataset.k||'squat'; speak(SOLO[k].start); startSoloSim(k); } a.disabled=true; break;
    case 'saveManual': toast('기록을 저장했어요'); break;
    case 'addEx': modal='addEx'; render(); break;
    case 'exPick': if(!S.addedEx.find(x=>x.n===a.dataset.n)) S.addedEx.push({n:a.dataset.n,d:a.dataset.d,custom:a.dataset.c==='1'}); LS.set('aiwm_myex',S.addedEx); modal=null; render(); toast(a.dataset.c==='1'?'트레이너 동작을 추가했어요':'기본 운동을 추가했어요 · 트레이너 미확인 표시'); break;
    case 'dietSample': S.dietRec={name:'롤케이크 1조각',kcal:450,img:null}; render(); break;
    case 'dietCancel': S.dietRec=null; render(); break;
    case 'dietAdd': S.meals.push({id:'m'+Date.now(),time:'간식',name:'롤케이크 일부',ai:+a.dataset.k,tr:null,img:S.dietRec&&S.dietRec.img}); S.dietRec=null; render(); toast('기록했어요 · 트레이너 확인 대기'); break;
    case 'goGoal': go('goal'); break;
    case 'viewMode': S.viewMode=a.dataset.v; keepScroll(render); break;
    case 'keepMode': S.keepMode=a.dataset.v; keepScroll(render); toast('보관 방식을 바꿨어요'); break;
    case 'calDay': S.calSel=a.dataset.k; keepScroll(render); break;
    case 'calPrev': S.calMonth=10; S.calSel=null; keepScroll(render); break;
    case 'calNext': S.calMonth=11; S.calSel='2026-11-03'; keepScroll(render); break;
    case 'goTab': tab('members'); break;
    case 'goTab2': tab('schedule'); break;
    case 'goTab3': tab('settle'); break;
    case 'goPractice': tab('practice'); break;
    case 'goNotes': tab('notes'); break;
    case 'goDiet': tab('diet'); break;
    case 'share': toast('시연용: 리포트 링크를 공유합니다'); break;
    case 'ttsHw': if(!speak('지난 수업 숙제입니다. 맨몸 스쿼트 열다섯 회 세 세트, 허벅지 수평 아래까지.')) toast('이 브라우저에서는 음성 재생을 쓸 수 없어요'); break;
    case 'goParq': go('parq'); break;
    case 'ptToggle': S.ptEnded=!S.ptEnded; render(); toast(S.ptEnded?'PT 종료 상태: 분석·식단 잠김':'PT 기간 상태로 돌아왔어요'); break;
    case 'ocrSample': S.ocr={img:null,model:'InBody 570',time:'07:40',w:61.4,smm:22.6,fm:17.9,bmr:1328}; render(); break;
    case 'ocrCancel': S.ocr=null; render(); break;
    case 'ocrSave': { const g=id=>parseFloat($('#'+id).value); const w=g('o_w'),smm=g('o_smm'),fm=g('o_fm'),bmr=g('o_bmr');
      if([w,smm,fm,bmr].some(v=>!isFinite(v)||v<=0)||fm>=w){toast('값을 다시 확인해 주세요');break;}
      const prev=S.inbody, model=($('#o_model').value||'').trim()||'기종 미상', time=($('#o_time').value||'').trim();
      const hr=t=>parseInt((t||'0').split(':')[0],10)||0; const diffModel=model!==prev.model, diffTime=Math.abs(hr(time)-hr(prev.time))>=4;
      S.ibWarn=(diffModel||diffTime)? `이전 측정(${prev.model}, ${prev.time})과 ${diffModel&&diffTime?'기종·시간대가':diffModel?'기종이':'시간대가'} 달라 값이 흔들릴 수 있어요. 예측 vs 실측 비교에 반영합니다.`:null;
      S.inbody={date:todayLabel(),model,time,w,smm,fm,pbf:Math.round(fm/w*1000)/10,bmr}; LS.set('aiwm_inbody',S.inbody); S.ocr=null; if(S.goal.target>=S.inbody.pbf) S.goal.target=Math.floor(S.inbody.pbf-1); render(); toast('인바디 저장 · 목표를 다시 계산했어요'); } break;
    case 'floor': S.goal.floor=a.dataset.v; keepScroll(render); break;
    case 'parq': S.parq[+a.dataset.i]=a.dataset.v==='1'; if(!parqYes()){S.parqFollow=false;S.medicalOk=false;} keepScroll(render); break;
    case 'parqF': S.parqFollow=a.dataset.v==='1'; S.medicalOk=false; keepScroll(render); break;
    case 'medOk': S.medicalOk=true; render(); toast('소견서 확인 · 잠금이 풀렸어요'); break;
    case 'medAck': { const m=$('#ackMsg'); if(m) m.textContent='안내 확인 기록: 11월 3일 '+new Date().toTimeString().slice(0,5)+' · 트레이너에게 강도 조절 알림 전송 (혼자 연습 잠금은 유지)'; } break;
  }
});
render();
})();
</script>
